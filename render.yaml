services:
  - type: web
    name: srividya-school-portal
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm install --prefix backend
    startCommand: node server.js
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
